name: SonarQube

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build:
    name: Build and analyze
    runs-on: ubuntu-latest

    # El proyecto Gradle vive en esta subcarpeta, no en la raiz del repositorio.
    defaults:
      run:
        working-directory: event-billing-engine

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # historial completo: Sonar lo necesita para detectar el codigo nuevo

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: 25          # el build.gradle.kts exige Java 25 (toolchain)
          distribution: temurin

      - name: Set up Gradle
        # Fijada al hash del commit (no a la etiqueta movible @v4), como pide la regla githubactions:S7637.
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Dar permiso de ejecucion a gradlew
        run: chmod +x gradlew       # en el repo gradlew no tiene permiso de ejecucion

      - name: Build and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        # jacocoTestReport va antes de sonar para que el reporte de cobertura ya exista.
        run: ./gradlew build jacocoTestReport sonar --info
